# ============================================================
# Funda Tracker Dashboard — Standalone (paste into web GUI)
# ============================================================
# Use this when creating a NEW dashboard:
# 1. Settings → Dashboards → Add dashboard → New dashboard from scratch
# 2. Open the new dashboard → ⋮ → Edit dashboard → ⋮ → Raw configuration editor
# 3. Replace ALL contents with this file
#
# If you want to add it as a view to an existing dashboard,
# use funda-dashboard.yaml instead.
#
# Requires: apexcharts-card from HACS
# ============================================================
title: Funda Tracker
views:
  - type: sections
    max_columns: 4
    title: Funda Tracker
    path: funda
    icon: mdi:home-analytics
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Woningwaarde
            heading_style: title
            icon: mdi:home-analytics
            badges:
              - type: entity
                entity: sensor.funda_tracker_delta_status
              - type: entity
                entity: sensor.funda_tracker_betrouwbaarheid
          - type: tile
            entity: sensor.funda_tracker_woningwaarde
            name: Huidige waarde
          - type: tile
            entity: sensor.funda_tracker_ondergrens
            name: Ondergrens
          - type: tile
            entity: sensor.funda_tracker_bovengrens
            name: Bovengrens
          - type: tile
            entity: sensor.funda_tracker_prijs_per_m2
            name: Prijs per m²
          - type: custom:apexcharts-card
            header:
              title: Waardecheck Historie
              show: true
            graph_span: 12month
            span:
              end: now
            yaxis:
              - id: value
                min: ~500000
                max: ~650000
                apex_config:
                  labels:
                    formatter: |
                      EVAL:function(val) { return '€' + (val/1000).toFixed(0) + 'k'; }
            series:
              - entity: sensor.funda_tracker_woningwaarde
                name: Waarde
                type: line
                color: "#1976D2"
                stroke_width: 3
                yaxis_id: value
                statistics:
                  type: mean
                  period: month
              - entity: sensor.funda_tracker_bovengrens
                name: Bovengrens
                type: area
                color: "#90CAF9"
                opacity: 0.15
                stroke_width: 0
                yaxis_id: value
                statistics:
                  type: mean
                  period: month
              - entity: sensor.funda_tracker_ondergrens
                name: Ondergrens
                type: area
                color: "#FFFFFF"
                opacity: 1
                stroke_width: 0
                yaxis_id: value
                statistics:
                  type: mean
                  period: month
            grid_options:
              columns: full
              rows: 4
      - type: grid
        cards:
          - type: heading
            heading: Statistieken
            heading_style: title
            icon: mdi:chart-line
          - type: tile
            entity: sensor.funda_tracker_maandwijziging
            name: Maandwijziging
          - type: tile
            entity: sensor.funda_tracker_maandwijziging_2
            name: Maandwijziging %
          - type: tile
            entity: sensor.funda_tracker_jaarwijziging
            name: Jaarwijziging
          - type: tile
            entity: sensor.funda_tracker_jaarwijziging_2
            name: Jaarwijziging %
          - type: tile
            entity: sensor.funda_tracker_all_time_high
            name: All-time high
          - type: tile
            entity: sensor.funda_tracker_all_time_low
            name: All-time low
      - type: grid
        cards:
          - type: heading
            heading: Financiën
            heading_style: title
            icon: mdi:cash-multiple
          - type: tile
            entity: number.funda_tracker_aankoopprijs
            name: Aankoopprijs
          - type: tile
            entity: number.funda_tracker_totale_investering
            name: Totale investering
          - type: tile
            entity: number.funda_tracker_hypotheek
            name: Hypotheek restschuld
          - type: tile
            entity: sensor.funda_tracker_overwaarde
            name: Overwaarde
          - type: tile
            entity: sensor.funda_tracker_marktwinst
            name: Marktwinst
          - type: tile
            entity: sensor.funda_tracker_markt_roi
            name: Markt ROI
          - type: tile
            entity: sensor.funda_tracker_totale_winst
            name: Totale winst
          - type: tile
            entity: sensor.funda_tracker_totale_roi
            name: Totale ROI
      - type: grid
        cards:
          - type: heading
            heading: Woning
            heading_style: title
            icon: mdi:home-city
          - type: markdown
            content: |
              **{{ state_attr('sensor.funda_tracker_woningwaarde', 'address') }}**

              🏠 **Type:** {{ state_attr('sensor.funda_tracker_woningwaarde', 'building_type') }}
              📐 **Woonoppervlakte:** {{ state_attr('sensor.funda_tracker_woningwaarde', 'floor_size') }} m²
              🌳 **Perceeloppervlakte:** {{ state_attr('sensor.funda_tracker_woningwaarde', 'plot_size') }} m²
              📅 **Bouwjaar:** {{ state_attr('sensor.funda_tracker_woningwaarde', 'year_of_construction') }}
              ✨ **Onderhoud:** {{ state_attr('sensor.funda_tracker_woningwaarde', 'maintenance_state') }}
              📍 **Buurt:** {{ state_attr('sensor.funda_tracker_woningwaarde', 'neighbourhood') }}, {{ state_attr('sensor.funda_tracker_woningwaarde', 'city') }}
          - type: heading
            heading: Alerts
            heading_style: subtitle
          - type: tile
            entity: input_number.funda_value_alert_high
            name: Melding boven
          - type: tile
            entity: input_number.funda_value_alert_low
            name: Melding onder
